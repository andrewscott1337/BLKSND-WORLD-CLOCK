<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLKSND | BURDEN // DESCENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #ededed; font-family: 'JetBrains Mono', monospace; overflow: hidden; margin: 0; }
        
        .panel { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .btn-launch { transition: all 0.2s ease; }
        .btn-launch:hover { background-color: #fff; color: #000; border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        .btn-exit { transition: all 0.2s ease; }
        .btn-exit:hover { color: #ff003c; border-color: #ff003c; background: rgba(255,0,60,0.1); }

        .glitch-text { text-shadow: 3px 0 #ff003c, -3px 0 rgba(0, 255, 255, 0.4); }

        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
        #ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .pointer-auto { pointer-events: auto; }
        
        /* Persistent CRT/Monitor Overlay */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <canvas id="gameCanvas"></canvas>
    <div class="scanlines"></div>

    <div id="ui-layer" class="w-full h-screen p-8 relative">
        
        <div id="hud-panel" class="absolute top-8 left-8 flex flex-col items-start pointer-events-none">
            <div class="flex flex-col gap-1 max-w-sm">
                <h1 class="text-4xl font-black tracking-[0.35em] font-['Montserrat'] uppercase text-white leading-none glitch-text">BLKSND</h1>
                <h2 class="text-[10px] font-light tracking-[0.5em] opacity-60 uppercase mt-2 mb-4 text-[#ff003c]">Burden // Isolation Descent</h2>

                <p class="text-[9px] tracking-[0.2em] text-[#aaa] uppercase leading-relaxed font-light mb-4 border-l-2 border-[#ff003c] pl-3 py-1">
                    "Block out the sun <br>
                    <span class="text-[#ff003c] font-bold">so we all go blind</span> <br>
                    Isolate, convince yourself you're fine."
                </p>

                <div class="text-[8px] opacity-40 uppercase tracking-widest mb-6 space-y-1">
                    <div>Controls //</div>
                    <div>Orient: Left/Right Arrows</div>
                    <div>Retro-Thrusters: Up Arrow</div>
                </div>

                <h2 class="text-2xl font-black font-['Montserrat'] tracking-[0.3em] uppercase text-white glitch-text" id="hud-title">BURDEN_DESCENT</h2>
                <div class="text-[10px] tracking-[0.3em] opacity-60 uppercase mt-1 text-[#aaa]" id="hud-stats">ALTITUDE: 8000M | V-VEL: 0.0 | FUEL: 100%</div>
                <div class="text-[11px] font-black text-[#ff003c] mt-2 tracking-[0.4em] uppercase hidden glitch-text" id="hud-alert">CRITICAL DAMAGE</div>

                <div id="lyric-display" class="mt-4 pointer-events-none z-20">
                    <h1 class="text-[10px] font-black font-['Montserrat'] tracking-[0.2em] text-[#ff003c] glitch-text leading-tight" style="opacity: 0.9; text-transform: uppercase;"></h1>
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hudPanel = document.getElementById('hud-panel');
        const hudStats = document.getElementById('hud-stats');
        const hudAlert = document.getElementById('hud-alert');
        const lyricDisplay = document.getElementById('lyric-display');
        const lyricText = lyricDisplay.querySelector('h1');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Handling
        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        const Engine = {
            state: 'menu',
            animationId: null,
            lastTime: 0,
            
            // Descent Physics & Camera
            camera: { y: 0 },
            levelHeight: 8000,
            ship: { x: 0, y: 0, vx: 0, vy: 0, angle: 0, fuel: 1000, status: 'flying' },
            
            terrain: [],
            obstacles: [],
            stars: [],
            padIndex: 0,
            segWidth: 0,
            
            // Ship Design: Sleek Geometric Drop-Pod
            shipPoints: [
                [0, -20], [6, 5], [10, 15], [4, 15], [0, 10], [-4, 15], [-10, 15], [-6, 5]
            ],
            flamePoints: [[-4, 15], [0, 28], [4, 15]],

            // Lyrics synced to descent depth
            lyrics: [
                { depth: 1000, text: "BLOCK OUT THE SUN" },
                { depth: 2500, text: "SO WE ALL GO BLIND" },
                { depth: 4000, text: "ISOLATE" },
                { depth: 5500, text: "CONVINCE YOURSELF" },
                { depth: 6500, text: "YOU'RE FINE" }
            ],
            nextLyric: 0,
            lyricTimer: 0,

            drawVector: function(points, x, y, angle, scale, color = '#fff', width = 2) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                ctx.scale(scale, scale);
                ctx.beginPath();
                ctx.moveTo(points[0][0], points[0][1]);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i][0], points[i][1]);
                }
                ctx.closePath();
                ctx.strokeStyle = color;
                ctx.lineWidth = width / scale;
                ctx.stroke();
                ctx.restore();
            },

            exitToMenu: function() {
                this.initLander();
            },

            initLander: function() {
                this.state = 'playing';
                hudAlert.classList.add('hidden');
                
                this.ship = { x: canvas.width/2, y: 0, vx: 0, vy: 0, angle: 0, fuel: 1000, status: 'flying' };
                this.camera.y = -150;
                this.nextLyric = 0;
                this.lyricTimer = 0;

                // Starfield Background
                this.stars = [];
                for(let i=0; i<150; i++) {
                    this.stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.5 });
                }

                // Brutalist Terrain Generation
                let segments = 60;
                this.segWidth = canvas.width / segments;
                this.padIndex = Math.floor(segments / 2) - 3;
                this.terrain = [];
                for(let i=0; i<=segments; i++) {
                    if (i >= this.padIndex && i <= this.padIndex + 6) {
                        this.terrain.push(this.levelHeight); // The Safe Pad
                    } else {
                        this.terrain.push(this.levelHeight - 100 - Math.random() * 450); // Jagged Abyss
                    }
                }

                // Floating Monoliths (Obstacles)
                this.obstacles = [];
                for(let i=0; i<35; i++) {
                    this.obstacles.push({
                        x: Math.random() * (canvas.width - 150),
                        y: 1000 + Math.random() * (this.levelHeight - 2500),
                        width: 80 + Math.random() * 150,
                        height: 20 + Math.random() * 60,
                        skew: (Math.random() - 0.5) * 40
                    });
                }

                this.lastTime = performance.now();
                this.loopLander(this.lastTime);
            },

            drawEclipse: function() {
                let sunY = canvas.height * 0.2 - this.camera.y * 0.08; 
                ctx.save();
                
                // Red Glow / Corona
                let gradient = ctx.createRadialGradient(canvas.width/2, sunY, 150, canvas.width/2, sunY, 400);
                gradient.addColorStop(0, 'rgba(255, 0, 60, 0.35)');
                gradient.addColorStop(1, 'rgba(255, 0, 60, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(canvas.width/2, sunY, 400, 0, Math.PI*2);
                ctx.fill();

                // Solid Obsidian Body
                ctx.beginPath();
                ctx.arc(canvas.width/2, sunY, 160, 0, Math.PI*2);
                ctx.fillStyle = '#050505';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ff003c';
                ctx.stroke();
                ctx.restore();
            },

            drawGlitch: function() {
                if (Math.random() > 0.97 && this.ship.status === 'flying') {
                    let sy = Math.random() * canvas.height;
                    let sh = 5 + Math.random() * 20;
                    let dx = (Math.random() - 0.5) * 20;
                    ctx.drawImage(canvas, 0, sy, canvas.width, sh, dx, sy, canvas.width, sh);
                }
            },

            loopLander: function(timestamp) {
                if(this.state !== 'playing') return;
                this.animationId = requestAnimationFrame(t => this.loopLander(t));
                
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let s = this.ship;

                // --- PHYSICS ---
                if (s.status === 'flying') {
                    if (keys['ArrowLeft']) s.angle -= 0.06;
                    if (keys['ArrowRight']) s.angle += 0.06;
                    let thrusting = keys['ArrowUp'] && s.fuel > 0;
                    
                    s.vy += 0.04; // Heavy gravity pull
                    
                    if (thrusting) {
                        s.vx += Math.sin(s.angle) * 0.12;
                        s.vy -= Math.cos(s.angle) * 0.12;
                        s.fuel -= 1.5;
                    }
                    
                    // Friction/Drag
                    s.vx *= 0.99;
                    s.vy *= 0.99;
                    
                    s.x += s.vx;
                    s.y += s.vy;

                    // Infinite horizontal wrap
                    if (s.x < 0) s.x = canvas.width;
                    if (s.x > canvas.width) s.x = 0;

                    // Camera Tracking (Smooth follow)
                    let targetCamY = s.y - canvas.height * 0.25; 
                    this.camera.y += (targetCamY - this.camera.y) * 0.1;
                    
                    let maxCamY = this.levelHeight - canvas.height + 50; 
                    if (this.camera.y > maxCamY) this.camera.y = maxCamY;
                    if (this.camera.y < -150) this.camera.y = -150;

                    // Monolith Collision
                    for(let obs of this.obstacles) {
                        if (s.x > obs.x && s.x < obs.x + obs.width && s.y > obs.y && s.y < obs.y + obs.height) {
                            s.status = 'crashed';
                            hudAlert.innerText = "THE PRICE WE'LL PAY // FATAL";
                            hudAlert.style.color = "#ff003c";
                            hudAlert.classList.remove('hidden');
                        }
                    }

                    // Floor Collision & Landing Logic
                    let segIdx = Math.floor(s.x / this.segWidth);
                    if (segIdx >= 0 && segIdx < this.terrain.length - 1) {
                        let y1 = this.terrain[segIdx];
                        let y2 = this.terrain[segIdx+1];
                        let t = (s.x - (segIdx * this.segWidth)) / this.segWidth;
                        let groundY = y1 + t * (y2 - y1);

                        // 22px is the visual offset of the ship's fins
                        if (s.y + 22 >= groundY) {
                            s.y = groundY - 22;
                            if (segIdx >= this.padIndex && segIdx < this.padIndex + 6 && Math.abs(s.angle) < 0.25 && s.vy < 1.8) {
                                s.status = 'landed';
                                hudAlert.innerText = "WE'LL SPEAK THROUGH LOVE // SAFE";
                                hudAlert.style.color = "#fff";
                                hudAlert.classList.remove('hidden');
                            } else {
                                s.status = 'crashed';
                                hudAlert.innerText = "THE PRICE WE'LL PAY // FATAL";
                                hudAlert.style.color = "#ff003c";
                                hudAlert.classList.remove('hidden');
                            }
                        }
                    }
                }

                // --- RENDERING ---
                
                // 1. Stars (Parallax)
                ctx.fillStyle = '#fff';
                for(let star of this.stars) {
                    let sy = (star.y - this.camera.y * 0.15) % canvas.height;
                    if (sy < 0) sy += canvas.height;
                    ctx.globalAlpha = 0.4;
                    ctx.beginPath();
                    ctx.arc(star.x, sy, star.size, 0, Math.PI*2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // 2. The Sun
                this.drawEclipse();

                // 3. Floating Monoliths
                for(let obs of this.obstacles) {
                    let screenY = obs.y - this.camera.y;
                    if (screenY > -100 && screenY < canvas.height + 100) {
                        ctx.fillStyle = '#0a0a0a';
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 2;
                        
                        ctx.beginPath();
                        ctx.moveTo(obs.x, screenY);
                        ctx.lineTo(obs.x + obs.width, screenY - obs.skew);
                        ctx.lineTo(obs.x + obs.width, screenY + obs.height);
                        ctx.lineTo(obs.x, screenY + obs.height + obs.skew);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                }

                // 4. Terrain Floor
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                for(let i=0; i<this.terrain.length; i++) {
                    ctx.lineTo(i * this.segWidth, this.terrain[i] - this.camera.y);
                }
                ctx.lineTo(canvas.width, canvas.height);
                ctx.fillStyle = '#050505';
                ctx.fill();

                // 5. Brutalist Floor Lines
                ctx.beginPath();
                ctx.moveTo(0, this.terrain[0] - this.camera.y);
                for(let i=1; i<this.terrain.length; i++) {
                    if (i > this.padIndex && i <= this.padIndex + 6) {
                        ctx.strokeStyle = '#fff'; // Safe Landing Zone
                        ctx.lineWidth = 4;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#fff';
                    } else {
                        ctx.strokeStyle = '#ff003c'; // Hostile Ground
                        ctx.lineWidth = 2;
                        ctx.shadowBlur = 0;
                    }
                    ctx.lineTo(i * this.segWidth, this.terrain[i] - this.camera.y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(i * this.segWidth, this.terrain[i] - this.camera.y);
                }
                ctx.shadowBlur = 0;

                // 6. The Ship
                let shipScreenY = s.y - this.camera.y;
                let thrusting = keys['ArrowUp'] && s.fuel > 0;

                if (s.status === 'flying' || s.status === 'landed') {
                    this.drawVector(this.shipPoints, s.x, shipScreenY, s.angle, 1.5, '#fff', 2);
                    if(thrusting && s.status === 'flying') {
                        // Dynamic flame flicker
                        let fP = [...this.flamePoints];
                        fP[1] = [0, 22 + Math.random()*8];
                        this.drawVector(fP, s.x, shipScreenY, s.angle, 1.5, '#ff003c', 2);
                    }
                } else if (s.status === 'crashed') {
                    ctx.strokeStyle = '#ff003c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(s.x - 20, shipScreenY - 10); ctx.lineTo(s.x + 20, shipScreenY + 15);
                    ctx.moveTo(s.x + 15, shipScreenY - 20); ctx.lineTo(s.x - 10, shipScreenY + 20);
                    ctx.stroke();
                }

                // 7. Lyrics System
                this.drawGlitch();

                if (this.nextLyric < this.lyrics.length && s.y > this.lyrics[this.nextLyric].depth) {
                    lyricText.innerText = this.lyrics[this.nextLyric].text;
                    this.lyricTimer = 150; // frames to display
                    this.nextLyric++;
                }

                if (this.lyricTimer > 0) {
                    this.lyricTimer--;
                    if (Math.random() > 0.85) {
                        let scale = 1 + Math.random() * 0.05;
                        lyricText.style.transform = `scale(${scale})`;
                    } else {
                        lyricText.style.transform = `scale(1)`;
                    }
                    if (this.lyricTimer <= 0) lyricText.innerText = '';
                }

                // 8. HUD Update
                let alt = Math.max(0, Math.floor(this.levelHeight - s.y));
                let fuelPct = Math.max(0, Math.floor((s.fuel / 1000) * 100));
                hudStats.innerText = `ALTITUDE: ${alt}M | V-VEL: ${(s.vy * 10).toFixed(1)} | FUEL: ${fuelPct}%`;
            }
        };

        // Hotkey exit
        window.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                window.location.href = '../index.html';
            }
        });

        // Auto-start
        Engine.initLander();
    </script>
</body>
</html>
